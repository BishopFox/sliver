  INVALID_ENCODING = 0;
  ISO_8859_15 = 1;
  UTF_32LE = 2;
}

enum CrackOutfileFormat {
  INVALID_FORMAT = 0;
  HASH_SALT = 1;          // 1 | hash[:salt]
  PLAIN = 2;              // 2 | plain
  HEX_PLAIN = 3;          // 3 | hex_plain
  CRACK_POS = 4;          // 4 | crack_pos
