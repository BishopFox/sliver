name: Comprehensive e2e Tests

on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: Test scope to run across the complete platform matrix
        required: true
        default: comprehensive
        type: choice
        options:
          - comprehensive
          - rportfwd
  workflow_call:
    inputs:
      test_scope:
        description: Test scope to run across the complete platform matrix
        required: false
        default: comprehensive
        type: string

permissions:
  contents: read

env:
  SLIVER_E2E_SCOPE: ${{ inputs.test_scope || 'comprehensive' }}

concurrency:
  group: comprehensive-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize invocation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check actor repository permission
        uses: actions/github-script@v9
        env:
          REQUESTING_ACTOR: ${{ github.triggering_actor }}
          REQUESTED_SCOPE: ${{ inputs.test_scope || 'comprehensive' }}
        with:
          script: |
            const testScope = process.env.REQUESTED_SCOPE || "comprehensive";
            if (!new Set(["comprehensive", "rportfwd"]).has(testScope)) {
              core.setFailed(`Unsupported E2E test scope: ${JSON.stringify(testScope)}`);
              return;
            }
            core.info(`Validated E2E test scope ${testScope}`);

            const isReleaseTag = context.eventName === "push" && context.ref.startsWith("refs/tags/v");
            if (isReleaseTag) {
              core.info(`Authorized release test invocation for ${context.ref}`);
              return;
            }

            const actor = process.env.REQUESTING_ACTOR || context.actor;
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: actor,
            });
            core.info(`${actor} has repository permission ${data.permission} (${data.role_name})`);
            if (data.permission !== "admin") {
              core.setFailed("Comprehensive e2e Tests may only be run by repository administrators");
            }

  rportfwd-security-regression:
    name: Reverse-port-forward malicious protocol regression
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SLIVER_ROOT_DIR: ${{ runner.temp }}/sliver-rportfwd-security
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Sliver build assets
        run: go run -buildvcs=false -mod=vendor ./util/cmd/assets

      - name: Test malicious destination poisoning and cross-session isolation
        run: >-
          go test -buildvcs=false -mod=vendor
          -tags=server,osusergo,netgo,go_sqlite,sliver_e2e
          ./server/c2
          -run '^TestMTLSYamux_ReversePortForwardAuthorizationCannotBePoisonedOrReplayed$'
          -count=1 -v

  darwin:
    name: comprehensive-e2e-darwin-${{ matrix.goarch }}
    needs: authorize
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            goarch: amd64
            server_arch: amd64
          - runner: macos-15
            goarch: arm64
            server_arch: arm64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare coverage artifact
        run: |
          mkdir -p e2e-results
          printf 'darwin/%s\n' '${{ matrix.goarch }}' > e2e-results/target-darwin-${{ matrix.goarch }}.txt

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Sliver build assets
        run: go run -buildvcs=false -mod=vendor ./util/cmd/assets

      - name: Build unmodified Sliver server
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.server_arch }}
          GOOS: darwin
        run: >-
          go build -buildvcs=false -mod=vendor -trimpath -tags go_sqlite,server
          -o sliver-server ./server

      - name: Compile comprehensive E2E driver
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.goarch }}
          GOOS: darwin
        run: >-
          go test -c -buildvcs=false -mod=vendor -trimpath -tags client,go_sqlite
          -o sliver-comprehensive-e2e ./test/e2e

      - name: Run selected E2E scope
        run: |
          set -o pipefail
          ./sliver-comprehensive-e2e \
            -test.v \
            -test.run=^TestComprehensiveE2E$ \
            -test.timeout=0 \
            -repo . \
            -server ./sliver-server \
            -server-arch ${{ matrix.server_arch }} \
            -target-os darwin \
            -target-arch ${{ matrix.goarch }} \
            -results ./e2e-results \
            -transports mtls,wg,http \
            -implant-modes session,beacon \
            -beacon-interval 10s 2>&1 | tee ./e2e-results/selected-e2e.log

      - name: Verify target reverse-port-forward coverage
        if: ${{ always() }}
        run: >-
          go run -buildvcs=false -mod=vendor ./test/e2e/rportfwd-report
          -input e2e-results
          -target-os darwin
          -target-arch ${{ matrix.goarch }}
          -transports mtls,wg,http

      - name: Upload target coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: comprehensive-e2e-target-darwin-${{ matrix.goarch }}
          path: e2e-results
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  linux-native:
    name: comprehensive-e2e-linux-${{ matrix.goarch }}
    needs: authorize
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goarch: amd64
            server_arch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
            server_arch: arm64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare coverage artifact
        run: |
          mkdir -p e2e-results
          printf 'linux/%s\n' '${{ matrix.goarch }}' > e2e-results/target-linux-${{ matrix.goarch }}.txt

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Sliver build assets
        run: go run -buildvcs=false -mod=vendor ./util/cmd/assets

      - name: Build unmodified Sliver server
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.server_arch }}
          GOOS: linux
        run: >-
          go build -buildvcs=false -mod=vendor -trimpath -tags go_sqlite,server
          -o sliver-server ./server

      - name: Compile comprehensive E2E driver
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.goarch }}
          GOOS: linux
        run: >-
          go test -c -buildvcs=false -mod=vendor -trimpath -tags client,go_sqlite
          -o sliver-comprehensive-e2e ./test/e2e

      - name: Run selected E2E scope
        run: |
          set -o pipefail
          ./sliver-comprehensive-e2e \
            -test.v \
            -test.run=^TestComprehensiveE2E$ \
            -test.timeout=0 \
            -repo . \
            -server ./sliver-server \
            -server-arch ${{ matrix.server_arch }} \
            -target-os linux \
            -target-arch ${{ matrix.goarch }} \
            -results ./e2e-results \
            -transports mtls,wg,http \
            -implant-modes session,beacon \
            -beacon-interval 10s 2>&1 | tee ./e2e-results/selected-e2e.log

      - name: Verify target reverse-port-forward coverage
        if: ${{ always() }}
        run: >-
          go run -buildvcs=false -mod=vendor ./test/e2e/rportfwd-report
          -input e2e-results
          -target-os linux
          -target-arch ${{ matrix.goarch }}
          -transports mtls,wg,http

      - name: Upload target coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: comprehensive-e2e-target-linux-${{ matrix.goarch }}
          path: e2e-results
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  linux-386:
    name: comprehensive-e2e-linux-386
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CONTAINER_NAME: sliver-comprehensive-e2e-linux-386-${{ github.run_id }}-${{ github.run_attempt }}
      IMAGE_NAME: sliver-comprehensive-e2e-linux-386:${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare coverage artifact
        run: |
          mkdir -p e2e-results
          printf 'linux/386\n' > e2e-results/target-linux-386.txt

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build linux/386 E2E image
        run: |
          set -euo pipefail
          go_version="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          docker buildx build \
            --load \
            --platform linux/386 \
            --build-arg "GO_VERSION=${go_version}" \
            --file test/e2e/Dockerfile.linux-386 \
            --tag "${IMAGE_NAME}" \
            .

      - name: Run selected E2E scope
        run: |
          set -o pipefail
          docker run \
            --name "${CONTAINER_NAME}" \
            --platform linux/386 \
            --env "SLIVER_E2E_SCOPE=${SLIVER_E2E_SCOPE}" \
            --volume "${PWD}/e2e-results:/results" \
            "${IMAGE_NAME}" 2>&1 | tee ./e2e-results/selected-e2e.log

      - name: Verify target reverse-port-forward coverage
        if: ${{ always() }}
        run: >-
          go run -buildvcs=false -mod=vendor ./test/e2e/rportfwd-report
          -input e2e-results
          -target-os linux
          -target-arch 386
          -transports mtls,wg,http

      - name: Clean up linux/386 Docker resources
        if: ${{ always() }}
        run: |
          docker rm --force "${CONTAINER_NAME}" 2>/dev/null || true
          docker image rm --force "${IMAGE_NAME}" 2>/dev/null || true
          docker buildx prune --all --force >/dev/null 2>&1 || true

      - name: Upload target coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: comprehensive-e2e-target-linux-386
          path: e2e-results
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  windows:
    name: comprehensive-e2e-windows-${{ matrix.goarch }}
    needs: authorize
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            goarch: 386
            server_arch: amd64
          - runner: windows-2022
            goarch: amd64
            server_arch: amd64
          - runner: windows-11-arm
            goarch: arm64
            server_arch: arm64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare coverage artifact
        run: |
          mkdir -p e2e-results
          printf 'windows/%s\n' '${{ matrix.goarch }}' > e2e-results/target-windows-${{ matrix.goarch }}.txt

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Sliver build assets
        run: go run -buildvcs=false -mod=vendor ./util/cmd/assets

      - name: Build unmodified Sliver server
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.server_arch }}
          GOOS: windows
        run: >-
          go build -buildvcs=false -mod=vendor -trimpath -tags go_sqlite,server
          -o sliver-server.exe ./server

      - name: Compile comprehensive E2E driver
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.goarch }}
          GOOS: windows
        run: >-
          go test -c -buildvcs=false -mod=vendor -trimpath -tags client,go_sqlite
          -o sliver-comprehensive-e2e.exe ./test/e2e

      - name: Run selected E2E scope
        run: |
          set -o pipefail
          ./sliver-comprehensive-e2e.exe \
            -test.v \
            -test.run=^TestComprehensiveE2E$ \
            -test.timeout=0 \
            -repo . \
            -server ./sliver-server.exe \
            -server-arch ${{ matrix.server_arch }} \
            -target-os windows \
            -target-arch ${{ matrix.goarch }} \
            -results ./e2e-results \
            -transports mtls,wg,http \
            -implant-modes session,beacon \
            -beacon-interval 10s 2>&1 | tee ./e2e-results/selected-e2e.log

      - name: Verify target reverse-port-forward coverage
        if: ${{ always() }}
        run: >-
          go run -buildvcs=false -mod=vendor ./test/e2e/rportfwd-report
          -input e2e-results
          -target-os windows
          -target-arch ${{ matrix.goarch }}
          -transports mtls,wg,http

      - name: Upload target coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: comprehensive-e2e-target-windows-${{ matrix.goarch }}
          path: e2e-results
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  aggregate-rportfwd:
    name: Aggregate reverse-port-forward E2E coverage
    needs:
      - authorize
      - rportfwd-security-regression
      - darwin
      - linux-native
      - linux-386
      - windows
    if: ${{ always() && needs.authorize.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download target coverage
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: comprehensive-e2e-target-*
          path: rportfwd-coverage-input

      - name: Prepare aggregate artifact
        if: ${{ always() }}
        run: |
          mkdir -p rportfwd-coverage-input rportfwd-coverage-summary
          printf 'Reverse-port-forward E2E coverage aggregate\n' > rportfwd-coverage-summary/README.txt

      - name: Aggregate coverage and enforce all 216 required cells
        id: aggregate
        if: ${{ always() }}
        continue-on-error: true
        run: >-
          go run -buildvcs=false -mod=vendor ./test/e2e/rportfwd-report
          -input rportfwd-coverage-input
          -output rportfwd-coverage-summary

      - name: Publish reverse-port-forward coverage table
        if: ${{ always() }}
        run: |
          report="rportfwd-coverage-summary/rportfwd-coverage.md"
          if [[ -s "${report}" ]]; then
            cat "${report}" >> "${GITHUB_STEP_SUMMARY}"
          else
            printf 'Reverse-port-forward coverage report is missing or empty: %s\n' "${report}" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload aggregate reverse-port-forward coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: comprehensive-e2e-rportfwd-coverage-summary
          path: rportfwd-coverage-summary
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Fail on failed prerequisites, missing, malformed, or unavailable coverage
        if: ${{ needs.rportfwd-security-regression.result != 'success' || needs.darwin.result != 'success' || needs.linux-native.result != 'success' || needs.linux-386.result != 'success' || needs.windows.result != 'success' || steps.download.outcome != 'success' || steps.aggregate.outcome != 'success' }}
        run: exit 1

  aggregate-coverage:
    name: Aggregate comprehensive E2E coverage
    needs:
      - authorize
      - rportfwd-security-regression
      - darwin
      - linux-native
      - linux-386
      - windows
    if: ${{ always() && needs.authorize.result == 'success' && inputs.test_scope != 'rportfwd' }}
    outputs:
      command_coverage_markdown: ${{ steps.publish_command_coverage.outputs.command_coverage_markdown }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download target coverage
        uses: actions/download-artifact@v8
        with:
          pattern: comprehensive-e2e-target-*
          path: coverage-input
          merge-multiple: true

      - name: Prepare aggregate artifact
        run: |
          mkdir -p coverage-input coverage-summary
          printf 'Comprehensive E2E coverage aggregate\n' > coverage-summary/README.txt

      - name: Aggregate coverage and enforce required cells
        id: aggregate
        continue-on-error: true
        run: >-
          go run -buildvcs=false -mod=vendor ./test/e2e/report
          -input coverage-input
          -output coverage-summary

      - name: Publish command coverage table
        id: publish_command_coverage
        if: ${{ always() }}
        run: |
          detailed_report="coverage-summary/coverage-summary.md"
          report="coverage-summary/command-coverage.md"
          if [[ ! -s "${report}" ]]; then
            printf 'Command coverage report is missing or empty: %s\n' "${report}" >&2
            exit 1
          fi

          delimiter="COMPREHENSIVE_E2E_COMMAND_COVERAGE_EOF"
          if grep -Fxq "${delimiter}" "${report}"; then
            printf 'Command coverage report contains the reserved output delimiter: %s\n' "${delimiter}" >&2
            exit 1
          fi

          {
            printf 'command_coverage_markdown<<%s\n' "${delimiter}"
            cat "${report}"
            printf '%s\n' "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

          if [[ -f "${detailed_report}" ]]; then
            cat "${detailed_report}" >> "${GITHUB_STEP_SUMMARY}"
          fi
          printf '\n## Command coverage by OS/architecture/transport\n\n' >> "${GITHUB_STEP_SUMMARY}"
          cat "${report}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload aggregate coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: comprehensive-e2e-coverage-summary
          path: coverage-summary
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Fail on failed prerequisites or failed or not-run coverage
        if: ${{ needs.rportfwd-security-regression.result != 'success' || needs.darwin.result != 'success' || needs.linux-native.result != 'success' || needs.linux-386.result != 'success' || needs.windows.result != 'success' || steps.aggregate.outcome != 'success' }}
        run: exit 1

  reflektor:
    name: Existing Reflektor test matrix
    needs: authorize
    if: ${{ inputs.test_scope != 'rportfwd' }}
    uses: ./.github/workflows/reflektor-tests.yml

  shellcode:
    name: Shellcode E2E test matrix
    needs: authorize
    if: ${{ inputs.test_scope != 'rportfwd' }}
    uses: ./.github/workflows/shellcode-tests.yml
