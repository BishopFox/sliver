// Path-valued CrackCommand fields are interpreted on the trusted
// crackstation host, not on the client or server. Absolute paths can access
// files outside Hashcat's workspace and therefore require trusted operators.
message CrackCommand {
  CrackAttackMode AttackMode = 1;
  HashType HashType = 2;
  repeated string Hashes = 3;
  // --version
  // --help
  bool Quiet = 4;
  bool HexCharset = 5;
  bool HexSalt = 6;
  bool HexWordlist = 7;
  bool Force = 8;
  bool DeprecatedCheckDisable = 9;
  bool Status = 10;
  bool StatusJSON = 11;
  uint32 StatusTimer = 12;
  uint32 StdinTimeoutAbort = 13;
  bool MachineReadable = 14;
  bool KeepGuessing = 15;
  bool SelfTestDisable = 16;
  bool Loopback = 17;
  bytes MarkovHcstat2 = 18; // --markov-hcstat2 FILE
  bool MarkovDisable = 19;
  bool MarkovClassic = 20;
  bool MarkovInverse = 21;
  uint32 MarkovThreshold = 22;
  uint32 Runtime = 23;
  string Session = 24; // [a-zA-Z0-9_-]
  // Deprecated: historical resume behavior. RestorePosition is the canonical
  // v7 resume field; RestoreShowCommand is the v7 display-and-stop operation.
  bool Restore = 25 [deprecated = true];
  bool RestoreDisable = 26;
  bytes RestoreFile = 27; // --restore-file-path FILE
  string Outfile = 28;
  repeated CrackOutfileFormat OutfileFormat = 29;
  bool OutfileAutohexDisable = 30;
  uint32 OutfileCheckTimer = 31;
  bool WordlistAutohexDisable = 32;
  string Separator = 33; // single char
  bool Stdout = 34;
  bool Show = 35;
  bool Left = 36;
  bool Username = 37;
  bool Remove = 38;
  uint32 RemoveTimer = 39;
  bool PotfileDisable = 40;
  bytes Potfile = 41; // --potfile-path FILE
  CrackEncoding EncodingFrom = 42;
  CrackEncoding EncodingTo = 43;
  uint32 DebugMode = 44;
  string DebugFile = 45;
  string InductionDir = 46;
  string OutfileCheckDir = 47;
  bool LogfileDisable = 48;
  uint32 HccapxMessagePair = 49;
  uint32 NonceErrorCorrections = 50;
  bytes KeyboardLayoutMapping = 51; // --keyboard-layout-mapping FILE
  string TruecryptKeyfiles = 52;
  string VeracryptKeyfiles = 53;
  optional uint32 VeracryptPimStart = 54;
  optional uint32 VeracryptPimStop = 55;
  bool Benchmark = 56;
  bool BenchmarkAll = 57;
  bool SpeedOnly = 58;
  bool ProgressOnly = 59;
  uint32 SegmentSize = 60 [deprecated = true];
  uint32 BitmapMin = 61;
  uint32 BitmapMax = 62;
  repeated uint32 CPUAffinity = 63;
  uint32 HookThreads = 64;
  bool HashInfo = 65;
  // --example-hashes (66)
  bool BackendIgnoreCUDA = 67;
  bool BackendIgnoreHip = 68;
  bool BackendIgnoreMetal = 69;
  bool BackendIgnoreOpenCL = 70;
  bool BackendInfo = 71;
  repeated uint32 BackendDevices = 72;
  repeated uint32 OpenCLDeviceTypes = 73;
  bool OptimizedKernelEnable = 74;
  bool MultiplyAccelDisabled = 75;
  CrackWorkloadProfile WorkloadProfile = 76 [deprecated = true];
  uint32 KernelAccel = 77;
  uint32 KernelLoops = 78;
  uint32 KernelThreads = 79;
  uint32 BackendVectorWidth = 80;
  uint32 SpinDamp = 81;
  bool HwmonDisable = 82;
  uint32 HwmonTempAbort = 83;
  uint32 ScryptTMTO = 84;
  uint64 Skip = 85;
  uint64 Limit = 86;
  bool Keyspace = 87;
  string RuleLeft = 88;
  string RuleRight = 89;
  bytes RulesFile = 90; // --rules-file FILE
  uint32 GenerateRules = 91;
  uint32 GenerateRulesFunMin = 92;
  uint32 GenerateRulesFunMax = 93;
  string GenerateRulesFuncSel = 94;
  int32 GenerateRulesSeed = 95;
  string CustomCharset1 = 96;
  string CustomCharset2 = 97;
  string CustomCharset3 = 98;
  string CustomCharset4 = 99;
  // Deprecated: Identify is a legacy positional operand, not Hashcat's
  // --identify switch. Use IdentifyMode or PositionalArguments.
  string Identify = 100;
  bool Increment = 101;
  uint32 IncrementMin = 102;
  uint32 IncrementMax = 103;
  bool SlowCandidates = 104;
  bool BrainServer = 105;
  uint32 BrainServerTimer = 106;
  bool BrainClient = 107;
  string BrainClientFeatures = 108;
  string BrainHost = 109;
  uint32 BrainPort = 110;
  string BrainPassword = 111;
  string BrainSession = 112;
  string BrainSessionWhitelist = 113;
  bool PipelineStats = 114;
  bool TaskTimeBreakdown = 115;
  uint32 MetalCompilerRuntime = 116;
  bool RestorePosition = 117; // Resume from the stored restore position.
  bool OutfileJSON = 118;
  bool DynamicX = 119;
  string SeekDBPath = 120;
  uint32 BenchmarkMin = 121;
  optional uint32 BenchmarkMax = 122;
  string BridgeParameter1 = 123;
  string BridgeParameter2 = 124;
  string BridgeParameter3 = 125;
  string BridgeParameter4 = 126;
  uint32 BackendDevicesVirtMulti = 127;
  uint32 BackendDevicesVirtHost = 128;
  bool TotalCandidates = 129;
  string Lookup = 130;
  string CustomCharset5 = 131;
  string CustomCharset6 = 132;
  string CustomCharset7 = 133;
  string CustomCharset8 = 134;
  bool IncrementInverse = 135;
  optional uint32 BypassDelay = 136;
  optional uint32 BypassThreshold = 137;
  bool BrainFeed = 138;
  bool ColorCracked = 139;
  bool HashCopy = 140;
  string EncryptWithPubkey = 141;
  bool IdentifyMode = 142;
  repeated string PositionalArguments = 143;
  string EncodingFromName = 144;
  string EncodingToName = 145;
  uint32 HashInfoLevel = 146;
  uint32 BackendInfoLevel = 147;
  optional uint32 HccapxMessagePairV7 = 148;
  optional uint32 NonceErrorCorrectionsV7 = 149;
  optional uint32 ScryptTMTOV7 = 150;
  optional uint32 GenerateRulesSeedV7 = 151;
  uint32 BrainClientFeaturesV7 = 152;
  optional uint32 BrainSessionV7 = 153;
  repeated uint32 BrainSessionWhitelistV7 = 154;
  bytes Stdin = 155;
  bool AdviceDisable = 156;
  optional uint32 HashMode = 157; // Canonical Hashcat mode; takes precedence over HashType.
  bool RestoreShowCommand = 158; // Display the stored command and stop.
  optional uint32 BrainServerTimerV7 = 159; // Explicit zero disables intermediate dumps.
  optional uint32 StatusTimerV7 = 160; // Presence preserves Hashcat's meaningful zero value.
  optional uint32 StdinTimeoutAbortV7 = 161; // Explicit zero disables the stdin timeout.
  optional uint32 OutfileCheckTimerV7 = 162; // Explicit zero disables outfile checking.
  optional uint32 BitmapMinV7 = 163;
  optional uint32 BitmapMaxV7 = 164;
  optional uint32 HwmonTempAbortV7 = 165; // Explicit zero disables temperature abort.
  repeated bytes RulesFilesV7 = 166; // Hashcat accepts more than one --rules-file.
  optional string BrainPasswordV7 = 167; // Presence preserves an explicitly empty password.
  optional uint32 GenerateRulesFuncMinV7 = 168;
  optional uint32 GenerateRulesFuncMaxV7 = 169;
  repeated string CredentialIDs = 170;
  string CredentialCollection = 171;
  bool IncludeCrackedCredentials = 172;
  // Optional exact crackstation HostUUID or name for synchronous query modes.
  string Crackstation = 173;
}

message CrackJob {
  string ID = 1;
  string CreatedAt = 2;
  string CompletedAt = 3;
  CrackJobStatus Status = 4;
  string Err = 5;

  CrackCommand Command = 7;
  string ResultFileID = 8;
  repeated CrackTask Tasks = 9;
  string Keyspace = 10;
  repeated CrackResult Results = 11;
  int64 UpdatedAt = 12;
  uint64 ResultCount = 13;
}

message CrackJobs { repeated CrackJob Jobs = 1; }

message CrackResult {
  string ID = 1;
  string CrackJobID = 2;
  string CrackTaskID = 3;
  string CredentialID = 4;
  string Hash = 5;
  bytes Plaintext = 6;
  int64 CreatedAt = 7;
}

message CrackResponse {
