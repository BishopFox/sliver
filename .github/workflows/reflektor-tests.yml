name: Reflektor Integration Test Matrix

on:
  push:
    branches:
      - master
    paths:
      - "implant/**"
      - "test/reflektor/**"
      - ".github/workflows/reflektor-tests.yml"
  pull_request:
    paths:
      - "implant/**"
      - "test/reflektor/**"
      - ".github/workflows/reflektor-tests.yml"
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  darwin:
    name: reflektor-darwin-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            goarch: amd64
            server_arch: amd64
          - runner: macos-15
            goarch: arm64
            server_arch: arm64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Sliver build assets
        run: go run -mod=vendor ./util/cmd/assets

      - name: Build Sliver server
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.server_arch }}
          GOOS: darwin
        run: go build -mod=vendor -trimpath -tags go_sqlite,server -o sliver-server ./server

      - name: Build Reflektor integration driver
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.goarch }}
          GOOS: darwin
        run: go build -mod=vendor -trimpath -tags client,go_sqlite -o sliver-reflektor-e2e ./test/reflektor

      - name: Load Sliver with Reflektor
        run: >-
          ./sliver-reflektor-e2e
          -repo .
          -server ./sliver-server
          -target-os darwin
          -target-arch ${{ matrix.goarch }}

  linux-native:
    name: reflektor-linux-${{ matrix.goarch }}-native
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goarch: amd64
            server_arch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
            server_arch: arm64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Sliver build assets
        run: go run -mod=vendor ./util/cmd/assets

      - name: Build Sliver server
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.server_arch }}
          GOOS: linux
        run: go build -mod=vendor -trimpath -tags go_sqlite,server -o sliver-server ./server

      - name: Build Reflektor integration driver
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.goarch }}
          GOOS: linux
        run: go build -mod=vendor -trimpath -tags client,go_sqlite -o sliver-reflektor-e2e ./test/reflektor

      - name: Load Sliver with Reflektor
        run: >-
          ./sliver-reflektor-e2e
          -repo .
          -server ./sliver-server
          -target-os linux
          -target-arch ${{ matrix.goarch }}

  linux-386:
    name: reflektor-linux-386-docker
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CONTAINER_NAME: sliver-reflektor-linux-386-${{ github.run_id }}-${{ github.run_attempt }}
      IMAGE_NAME: sliver-reflektor-linux-386:${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build linux/386 test image
        run: |
          set -euo pipefail
          go_version="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          docker buildx build \
            --load \
            --platform linux/386 \
            --build-arg "GO_VERSION=${go_version}" \
            --file test/reflektor/Dockerfile.linux-386 \
            --tag "${IMAGE_NAME}" \
            .
          docker buildx prune --all --force

      - name: Load Sliver with Reflektor
        run: >-
          docker run
          --name "${CONTAINER_NAME}"
          --platform linux/386
          "${IMAGE_NAME}"

      - name: Clean up linux/386 Docker resources
        if: ${{ always() }}
        run: |
          docker rm --force "${CONTAINER_NAME}" 2>/dev/null || true
          docker image rm --force "${IMAGE_NAME}" 2>/dev/null || true
          docker buildx prune --all --force >/dev/null 2>&1 || true

  windows:
    name: reflektor-windows-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            goarch: amd64
            server_arch: amd64
          - runner: windows-2022
            goarch: 386
            server_arch: amd64
          - runner: windows-11-arm
            goarch: arm64
            server_arch: amd64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Sliver build assets
        run: go run -mod=vendor ./util/cmd/assets

      - name: Build Sliver server
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.server_arch }}
          GOOS: windows
        run: go build -mod=vendor -trimpath -tags go_sqlite,server -o sliver-server.exe ./server

      - name: Build Reflektor integration driver
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.goarch }}
          GOOS: windows
        run: go build -mod=vendor -trimpath -tags client,go_sqlite -o sliver-reflektor-e2e.exe ./test/reflektor

      - name: Load Sliver with Reflektor
        run: >-
          ./sliver-reflektor-e2e.exe
          -repo .
          -server ./sliver-server.exe
          -target-os windows
          -target-arch ${{ matrix.goarch }}
