  string Vendor = 3;
  string Name = 4;
  string Version = 5;
  int32 Processors = 6;
  int32 Clock = 7;
  string MemoryTotal = 8;
  string MemoryFree = 9;

  string CUDAVersion = 10;
  uint32 BackendDeviceID = 11;
  optional uint32 BackendDeviceAlias = 12;
  optional uint32 PreferredThreadSize = 13;
  optional bool MemoryUnified = 14;
  string LocalMemory = 15;
  string CacheSize = 16;
  string PCIAddress = 17;
}

