  string MemoryTotal = 8;
  string MemoryFree = 9;

  string OpenCLVersion = 10;
  string OpenCLDriverVersion = 11;
  uint32 BackendDeviceID = 12;
  optional uint32 BackendDeviceAlias = 13;
  optional uint32 PreferredThreadSize = 14;
  optional bool MemoryUnified = 15;
  string LocalMemory = 16;
  string MemoryAllocPerBlock = 17;
  string PCIAddress = 18;
  uint32 PlatformID = 19;
  string PlatformVendor = 20;
  string PlatformName = 21;
  string PlatformVersion = 22;
}

message MetalBackendInfo {
