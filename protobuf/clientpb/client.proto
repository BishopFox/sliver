enum CrackAttackMode {
  STRAIGHT = 0;
  COMBINATION = 1;
  BRUTEFORCE = 3;
  PCFG = 4;
  HYBRID_WORDLIST_MASK = 6;
  HYBRID_MASK_WORDLIST = 7;
  GENERIC = 8;
  ASSOCIATION = 9;
  NO_ATTACK = 10;
  HYBRID = 12;
}

