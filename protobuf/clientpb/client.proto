  repeated CertificateAuthorityData info = 1;
}

// [ Synchronous crack queries ] ---------------------------

enum CrackQueryMode {
  CRACK_QUERY_UNSPECIFIED = 0;
  CRACK_QUERY_KEYSPACE = 1;
  CRACK_QUERY_TOTAL_CANDIDATES = 2;
  CRACK_QUERY_LOOKUP = 3;
  CRACK_QUERY_IDENTIFY = 4;
  CRACK_QUERY_HASH_INFO = 5;
}

message CrackQueryResult {
  CrackQueryMode Mode = 1;
  string CrackstationHostUUID = 2;
  string CrackstationName = 3;
  string HashcatVersion = 4;
  string Value = 5;
  string Stderr = 6;
}
