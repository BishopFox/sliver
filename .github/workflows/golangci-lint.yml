name: golangci-lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - ".golangci.yml"
      - ".github/workflows/golangci-lint.yml"
      - "go.mod"
      - "go.sum"
      - "go.work"
      - "go.work.sum"
      - "Makefile"
      - "vendor/**"
      - "**/*.go"

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: golangci-lint (${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        goos:
          - linux
          - darwin
          - windows
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: amd64
      CGO_ENABLED: "0"
    steps:
      - name: Check Out Code
        uses: actions/checkout@v6

      - name: Go 1.26.2
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          # Keep legacy findings visible without making them blockers.
          only-new-issues: true
          args: ./client/... ./server/... ./util/... ./protobuf/... ./docs ./implant/...
