// [ Crackstation ] ----------------------------------------
message Crackstations { repeated Crackstation Crackstations = 1; }

enum States {
  IDLE = 0;
  CRACKING = 1;
  INITIALIZING = 2;
}

message CrackstationStatus {
  string Name = 1;
  string HostUUID = 2;
  States State = 3;
  string CurrentCrackJobID = 4;
  bool IsSyncing = 5;
  CrackSyncStatus Syncing = 6;
}

enum CrackJobStatus {
  IN_PROGRESS = 0;
  COMPLETED = 1;
  FAILED = 2;
  CANCELLED = 3;
}

enum CrackTaskKind {
  CRACK_TASK_UNSPECIFIED = 0;
  CRACK_TASK_CRACK = 1;
  CRACK_TASK_KEYSPACE = 2;
  CRACK_TASK_BENCHMARK = 3;
  CRACK_TASK_QUERY = 4;
}

enum CrackTaskState {
  CRACK_TASK_QUEUED = 0;
  CRACK_TASK_LEASED = 1;
  CRACK_TASK_RUNNING = 2;
  CRACK_TASK_COMPLETED = 3;
  CRACK_TASK_FAILED = 4;
  CRACK_TASK_CANCELLED = 5;
}

message CrackSyncStatus {
  float Speed = 1;
  map<string, float> Progress = 2;
}

message CrackBenchmark {
  string Name = 1;
  string HostUUID = 2;
  map<int32, uint64> Benchmarks = 3;
  uint32 SchemaVersion = 4;
  string HashcatVersion = 5;
}

message CrackTask {
  string ID = 1;
  string HostUUID = 2; // CrackstationID
  int64 CreatedAt = 3;
  int64 StartedAt = 4;
  int64 CompletedAt = 5;

  string Err = 7;
  bytes Stdout = 8;

  CrackCommand Command = 9;
  bytes Stderr = 10;
  int32 ExitCode = 11;
  bool StdoutTruncated = 12;
  bool StderrTruncated = 13;
  uint64 StdoutTotalBytes = 14;
  uint64 StderrTotalBytes = 15;
  string CrackJobID = 16;
  CrackTaskKind Kind = 17;
  CrackTaskState State = 18;
  uint32 Attempt = 19;
  string LeaseToken = 20;
  int64 LeaseExpiresAt = 21;
  int64 UpdatedAt = 22;
  int64 LastHeartbeatAt = 23;
  string Keyspace = 24;
  bytes LatestStatusJSON = 25;
  bytes RecoveredJSON = 26;
  uint64 ShardSkip = 27;
  uint64 ShardLimit = 28;
}

message Crackstation {
  string ID = 1;
  string Name = 2;
  string OperatorName = 3;
  string GOOS = 4;   // The cracker's OS
  string GOARCH = 5; // The cracker's Arch
  string HashcatVersion = 6;
  string HostUUID = 7;
  string Version = 8;
  map<int32, uint64> Benchmarks = 9;
  CrackstationStatus Status = 10;

  repeated CUDABackendInfo CUDA = 100;
  repeated MetalBackendInfo Metal = 101;
  repeated OpenCLBackendInfo OpenCL = 102;
  repeated HIPBackendInfo HIP = 103;
  repeated string Capabilities = 104;
}

